<title>Highlights</title>
<style>
:root{--paper:#f3ede2;--ink:#1f1b16;--mute:#7a7165;--line:#ddd3c3;--accent:#8a2b1d;--card:#faf6ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
header{position:sticky;top:0;z-index:5;background:var(--paper);padding:calc(14px + env(safe-area-inset-top)) 20px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
#count{font-size:11px}
#q{width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--line);background:var(--card);border-radius:8px;font:16px Georgia,serif;color:var(--ink);outline:none}
#q:focus{border-color:var(--ink)}
#years,#chips{display:flex;gap:8px;overflow-x:auto;margin:10px -20px 0;padding:0 20px 4px;scrollbar-width:none}
#years::-webkit-scrollbar,#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:12px ui-monospace,Menlo,monospace;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
main{padding:8px 20px 60px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:26px 22px 18px;margin:16px 0;box-shadow:0 1px 0 rgba(31,27,22,.04),0 8px 20px -14px rgba(31,27,22,.25)}
.card blockquote{margin:0;font-size:21px;line-height:1.42;letter-spacing:-.005em}
.card blockquote:before{content:"\201C";display:block;font-size:44px;line-height:.6;color:var(--accent);margin-bottom:6px}
.note{margin-top:14px;padding-left:12px;border-left:2px solid var(--accent);font-size:14px;color:var(--mute);font-style:italic}
.src{margin-top:20px;padding-top:12px;border-top:1px solid var(--line)}
.src .t{font-size:14px;font-weight:600;line-height:1.3}
.src .t a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.src .a{margin-top:3px}
.empty,#gate{text-align:center;color:var(--mute);padding:80px 30px;line-height:1.5}
#gate button{margin-top:18px;padding:12px 20px;background:var(--ink);color:var(--paper);border:0;border-radius:8px;font:14px ui-monospace,Menlo,monospace;cursor:pointer}
.hide{display:none!important}
#out,.lnk{background:none;border:0;color:var(--mute);font:11px ui-monospace,Menlo,monospace;cursor:pointer;padding:0;text-transform:uppercase;letter-spacing:.06em}
#msg{font-size:11px;margin-top:6px;min-height:0}
</style></head><body>
<div id="gate" class="hide"><div style="font-size:22px;color:var(--ink)">Highlights</div><div style="margin-top:8px">Private. Sign in to read.</div><button id="in">Sign in with Google</button><div id="gerr" class="mono" style="margin-top:14px"></div></div>
<div id="app" class="hide">
<header>
 <div class="top"><h1>Highlights</h1><span class="mono"><span id="count"></span> &nbsp; <button id="imp" class="lnk">Import</button> &nbsp; <button id="out">Sign out</button><input id="file" type="file" accept=".json,application/json" class="hide"></span></div>
 <input id="q" type="search" placeholder="Search highlights" autocomplete="off">
 <div id="years"></div>
 <div id="chips"></div>
 <div id="msg" class="mono"></div>
</header>
<main id="feed"></main>
</div>
<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyDoEVfhqiolhLBetaTIPok397LsSVxnIYY",authDomain:"founder-deck-7d483.firebaseapp.com",projectId:"founder-deck-7d483"};
const OWNER="adaniyashmi@gmail.com";
const COLL="kindle_highlights"; // stored at users/{uid}/kindle_highlights, covered by the existing owner-only rule
let STORE=null;
let ALL=[],SRC="",Q="",YR="";
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(d){const x=new Date(d);return isNaN(x)?"":x.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
function render(){
  const q=Q.toLowerCase();
  const rows=ALL.filter(h=>(!SRC||h.source.title===SRC)&&(!YR||String(h.added).slice(0,4)===YR)&&(!q||(h.text+" "+h.source.title+" "+h.source.author+" "+(h.note||"")).toLowerCase().includes(q)));
  $("count").textContent=rows.length+(rows.length===1?" highlight":" highlights");
  $("feed").innerHTML=rows.length?rows.map(h=>`<article class="card"><blockquote>${esc(h.text)}</blockquote>${h.note?`<div class="note">${esc(h.note)}</div>`:""}<div class="src"><div class="t">${h.source.url?`<a href="${esc(h.source.url)}" target="_blank" rel="noopener">${esc(h.source.title)}</a>`:esc(h.source.title)}</div><div class="a mono">${esc([h.source.author,fmt(h.added)].filter(Boolean).join(" · "))}</div></div></article>`).join(""):`<div class="empty">${ALL.length?"Nothing matches.":"No highlights yet. Plug in your Kindle and run the sync."}</div>`;
}
function chips(){
  const names=[...new Set(ALL.filter(h=>!YR||String(h.added).slice(0,4)===YR).map(h=>h.source.title))];
  $("chips").innerHTML=[["","All"],...names.map(n=>[n,n])].map(([v,l])=>`<button class="chip${v===SRC?" on":""}" data-v="${esc(v)}">${esc(l)}</button>`).join("");
}
function years(){
  const ys=[...new Set(ALL.map(h=>String(h.added).slice(0,4)))].filter(y=>/^\d{4}$/.test(y)).sort().reverse();
  $("years").innerHTML=ys.length>1?[["","All years"],...ys.map(y=>[y,y])].map(([v,l])=>`<button class="chip yr${v===YR?" on":""}" data-y="${v}">${l}</button>`).join(""):"";
}
function load(list){ALL=list.sort((a,b)=>String(b.added).localeCompare(String(a.added)));years();chips();render()}
document.addEventListener("click",e=>{const y=e.target.closest(".yr");if(y){YR=y.dataset.y;if(SRC&&!ALL.some(h=>h.source.title===SRC&&(!YR||String(h.added).slice(0,4)===YR)))SRC="";years();chips();render();return}const c=e.target.closest(".chip");if(c){SRC=c.dataset.v;chips();render()}});
$("q").addEventListener("input",e=>{Q=e.target.value;render()});
async function main(){
  if(location.search.includes("demo")){
    $("app").classList.remove("hide");$("out").classList.add("hide");
    load(await (await fetch("demo.json")).json());return}
  const [{initializeApp},{getAuth,onAuthStateChanged,signInWithPopup,signInWithRedirect,GoogleAuthProvider,signOut},{getFirestore,collection,getDocs,query,orderBy,doc,writeBatch,getCountFromServer}]=await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")]);
  const app=initializeApp(FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);
  $("in").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")signInWithRedirect(auth,new GoogleAuthProvider());else $("gerr").textContent=e.code}};
  $("out").onclick=()=>signOut(auth);
  onAuthStateChanged(auth,async u=>{
    if(!u||u.email!==OWNER){ALL=[];$("feed").innerHTML="";$("app").classList.add("hide");$("gate").classList.remove("hide");
      if(u&&u.email!==OWNER){$("gerr").textContent="That account has no access.";signOut(auth)}return}
    $("gate").classList.add("hide");$("app").classList.remove("hide");
    const col=collection(db,"users",u.uid,COLL);
    const refresh=async()=>{const s=await getDocs(query(col,orderBy("added","desc")));load(s.docs.map(d=>({id:d.id,...d.data()})))};
    $("imp").onclick=()=>$("file").click();
    $("file").onchange=async e=>{
      const f=e.target.files[0];if(!f)return;const m=$("msg");
      try{
        const rows=JSON.parse(await f.text());if(!Array.isArray(rows))throw new Error("not a highlights file");
        for(let i=0;i<rows.length;i+=400){const b=writeBatch(db);rows.slice(i,i+400).forEach(h=>b.set(doc(col,h.id),h));await b.commit();m.textContent="Uploading "+Math.min(i+400,rows.length)+" of "+rows.length}
        await refresh();
        const n=(await getCountFromServer(col)).data().count;
        m.textContent="Saved. "+n+" highlights stored in your account.";
      }catch(err){m.textContent="Import failed: "+(err.code||err.message)}
      e.target.value="";
    };
    try{await refresh()}
    catch(e){$("feed").innerHTML='<div class="empty">Could not load highlights ('+esc(e.code||e.message)+').</div>'}
  });
}
main();
</script></body></html>
